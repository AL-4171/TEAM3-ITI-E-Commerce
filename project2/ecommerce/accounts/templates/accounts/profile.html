<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f7f6fc;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .profile {

            background: white;

            width: 500px;

            max-width: 90%;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.1);

            animation: show 0.6s ease;

        }


        h1 {

            font-family: Georgia, serif;

            color: #161129;

        }


        .info {

            padding: 15px 0;

            border-bottom: 1px solid #eee;

        }


        .logout {

            display: block;

            margin-top: 25px;

            padding: 14px;

            text-align: center;

            background: #5B3DF5;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            transition: 0.3s;

        }


        .logout:hover {

            background: #3B24B8;

            transform: translateY(-2px);

        }


        @keyframes show {

            from {

                opacity: 0;

                transform: translateY(25px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

    </style>

</head>


<body>


<div class="profile">

    <h1>
        My Profile
    </h1>


    <div class="info">

        <strong>First Name:</strong>

        {{ user.first_name }}

    </div>


    <div class="info">

        <strong>Last Name:</strong>

        {{ user.last_name }}

    </div>


    <div class="info">

        <strong>Email:</strong>

        {{ user.email }}

    </div>


    <div class="info">

        <strong>Mobile:</strong>

        {{ user.mobile }}

    </div>


    <a
        class="logout"
        href="{% url 'accounts:logout' %}"
    >
        Logout
    </a>

</div>


</body>

</html>
