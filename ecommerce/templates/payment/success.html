{% extends 'base.html' %}

{% block title %}Payment Successful - Electro Store{% endblock %}

{% block content %}
<div class="wrap reveal" style="max-width: 500px; margin-top: 80px; margin-bottom: 80px; text-align: center;">
    <div class="admin-form">
        <div style="width: 60px; height: 60px; background: var(--mint); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.8rem; font-weight: bold;">
            ✓
        </div>
        <h2 style="font-family: var(--display); font-size: 1.8rem; margin-bottom: 10px;">Payment Successful!</h2>
        <p style="color: var(--muted); margin-bottom: 24px;">Your transaction has been completed successfully.</p>
        
        <a href="{% url 'catalog:home' %}" class="btn btn-ghost" style="display: inline-block;">
            <span>Back to Home</span>
        </a>
    </div>
</div>
{% endblock %}
